version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: launchpad_db
    environment:
      POSTGRES_DB: launchpad_db
      POSTGRES_USER: launchpad_user
      POSTGRES_PASSWORD: launchpad_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
